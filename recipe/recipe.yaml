schema_version: 1

context:
  name: gcloud-aio-taskqueue
  version: "7.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gcloud_aio_taskqueue-${{ version }}.tar.gz
  sha256: fc38214884ed0dff3def6ec3e78785b93fa67f5390cec0091f4223e39b84f9a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }},<4.0
    - gcloud-aio-auth >=3.1.0,<6.0.0

tests:
  - python:
      imports:
        - gcloud.aio.taskqueue
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python Client for Google Cloud Task Queue
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar
